

[tool.ruff]
exclude = [
    ".venv",
    "node_modules",
    "customer-agent-temp",
]

[tool.pyright]
exclude = [
    "**/.venv",
    "**/node_modules",
    "**/customer-agent-temp",
]

[project]
name = "omnidesk-customer-assistant"
version = "1.0.0"
description = "OmniDesk Customer Support RAG Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
]
