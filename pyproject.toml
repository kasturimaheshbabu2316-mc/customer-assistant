

[tool.ruff]
exclude = [
    ".venv",
    ".service",
    "node_modules",
    "customer-agent-temp",
    ".agents",
    ".agent",
]

[tool.ruff.lint]
ignore = [
    "E501",
    "E402",
    "W291",
    "W292",
    "W293",
    "F401",
    "F541",
    "I001",
    "SIM102",
    "SIM117",
    "BLE001",
    "S110",
    "B904",
    "UP007",
    "UP035",
]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [
    "**/.venv",
    "**/.service",
    "**/node_modules",
    "**/customer-agent-temp",
    "**/.agents",
    "**/.agent",
]
reportUnusedCallResult = false
reportAny = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeArgument = false
reportDeprecated = false

[project]
name = "omnidesk-customer-assistant"
version = "1.0.0"
description = "OmniDesk Customer Support RAG Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
]
